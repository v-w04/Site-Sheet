<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
 body{font:13px Arial,sans-serif;width:340px;margin:10px}
 .caja{padding:7px 10px;border-radius:6px;margin-bottom:6px;background:#eee;line-height:1.35;overflow-wrap:anywhere}
 .caja b{display:block;font-size:11px;font-weight:bold;opacity:.7;text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
 .caja small{display:block;opacity:.65;margin-top:1px}
 .ok{background:#e6f6e9!important;color:#17642a}.mal{background:#fde8e7!important;color:#9b1c14}.curso{background:#fff4d6!important;color:#7a5b00}
 .botones{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 6px}
 button{padding:8px 6px;cursor:pointer;font-size:13px}
 #o{display:inline-block;margin-top:2px}
</style></head><body>
<div id="e" class="caja"></div>
<div id="od" class="caja"></div>
<div id="ca" class="caja"></div>
<div id="sc" class="caja"></div>
<div class="botones">
 <button id="b">Enviar ahora</button>
 <button id="c">Cancelar pendientes ahora</button>
 <button id="s">Leer Seller Center ahora</button>
</div>
<a href="#" id="o">Opciones</a>
<script src="popup.js"></script>
</body></html>
